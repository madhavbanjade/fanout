events {}

http {
  upstream api_instances {
    # Keep Socket.IO polling requests on the same API instance.
    ip_hash;
    server 127.0.0.1:3000;
    server 127.0.0.1:3002;
  }

  server {
    listen 8080;

    location /socket.io/ {
      proxy_pass http://api_instances;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400s;
    }

    location / {
      proxy_pass http://api_instances;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}


# //"My WebSocket connection lives in the memory of whichever server instance I happened to connect to. If a different instance receives the request to notify me, it has no way to reach my connection directly — so I use Redis as a shared broadcast channel that every instance is subscribed to. When any instance wants to send me something, it publishes to Redis instead of trying to deliver it directly, and whichever instance is actually holding my connection picks it up from there and delivers it. I proved this works by connecting my browser to Instance 1 and triggering the notification through Instance 2 — and it still arrived.
# Capacity — split the load so neither server is stressed, responses stay fast/stable
# Resilience — if one dies, the other keeps the app running with zero downtime    

                #     yourapp.com (public URL)
                #             │
                #         [ Nginx ]
                #         /        \
                # Instance 1      Instance 2
                # (backend)       (backend)
                #         \        /
                #     [ Redis ]  [ Postgres ]